apply plugin: 'com.android.application'

def rafcodephiAppPackage = System.getenv("RAFCODEPHI_APP_PACKAGE_NAME") ?: "com.termux.rafacodephi"
def rafcodephiApiPackage = System.getenv("RAFCODEPHI_API_PACKAGE_NAME") ?: "${rafcodephiAppPackage}.api"
if (rafcodephiAppPackage != "com.termux.rafacodephi" || rafcodephiApiPackage != "com.termux.rafacodephi.api") {
    throw new GradleException("RAFCODEPHI app/API package identities are canonical and cannot be overridden.")
}
def rafcodephiSharedVersion = System.getenv("RAFCODEPHI_TERMUX_SHARED_VERSION") ?: "31df72137513885ec2535077141f8597496fce73"
def rafcodephiSharedMode = System.getenv("RAFCODEPHI_TERMUX_SHARED_MODE") ?: "jitpack"
def pairedKeystoreFile = System.getenv("RAFCODEPHI_PAIRED_KEYSTORE_FILE") ?: ""
def pairedKeystorePassword = System.getenv("RAFCODEPHI_PAIRED_KEYSTORE_PASSWORD") ?: ""
def pairedKeyAlias = System.getenv("RAFCODEPHI_PAIRED_KEY_ALIAS") ?: ""
def pairedKeyPassword = System.getenv("RAFCODEPHI_PAIRED_KEY_PASSWORD") ?: ""
def pairedSigningValues = [pairedKeystoreFile, pairedKeystorePassword, pairedKeyAlias, pairedKeyPassword]
def hasAnyPairedSigningMaterial = pairedSigningValues.any { !it.isEmpty() }
def hasPairedSigningMaterial = pairedSigningValues.every { !it.isEmpty() }
if (hasAnyPairedSigningMaterial && !hasPairedSigningMaterial) {
    throw new GradleException("RAFCODEPHI paired signing requires all RAFCODEPHI_PAIRED_* variables.")
}

android {
    namespace "com.termux.api"

    compileSdk project.properties.compileSdkVersion.toInteger()
    def appVersionName = System.getenv("TERMUX_API_APP__BUILD__APP_VERSION_NAME") ?: ""
    def apkVersionTag = System.getenv("TERMUX_API_APP__BUILD__APK_VERSION_TAG") ?: ""
    defaultConfig {
        applicationId rafcodephiApiPackage
        minSdk project.properties.minSdkVersion.toInteger()
        targetSdk project.properties.targetSdkVersion.toInteger()
        versionCode 1002
        versionName "0.53.0"

        if (appVersionName) versionName = appVersionName
        validateVersionName(versionName)

        manifestPlaceholders.TERMUX_APP_NAME = "Termux"
        manifestPlaceholders.TERMUX_API_APP_NAME = "Termux:API"
        manifestPlaceholders.RAFCODEPHI_APP_PACKAGE = rafcodephiAppPackage
        manifestPlaceholders.RAFCODEPHI_API_PACKAGE = rafcodephiApiPackage
        buildConfigField "String", "RAFCODEPHI_APP_PACKAGE", "\"${rafcodephiAppPackage}\""
        buildConfigField "String", "RAFCODEPHI_API_PACKAGE", "\"${rafcodephiApiPackage}\""

        externalNativeBuild {
            cmake {
                cFlags "-std=c11 -O3 -fvisibility=hidden"
                abiFilters "armeabi-v7a", "arm64-v8a"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    signingConfigs {
        debug {
            storeFile file('testkey_untrusted.jks')
            keyAlias 'alias'
            storePassword 'xrj45yWGLbsO7W0v'
            keyPassword 'xrj45yWGLbsO7W0v'
        }
        if (hasPairedSigningMaterial) {
            paired {
                storeFile file(pairedKeystoreFile)
                storePassword pairedKeystorePassword
                keyAlias pairedKeyAlias
                keyPassword pairedKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false // Reproducible builds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            if (hasPairedSigningMaterial) signingConfig signingConfigs.paired
        }

        debug {
            signingConfig hasPairedSigningMaterial ? signingConfigs.paired : signingConfigs.debug
        }
    }

    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a"
            universalApk false
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def abi = output.getFilter(com.android.build.OutputFile.ABI)
            def artifactTag = apkVersionTag ? apkVersionTag : "v" + versionName + "+" + variant.buildType.name
            if (abi) {
                outputFileName = "termux-api-app_${artifactTag}-${abi}.apk"
            } else {
                outputFileName = "termux-api-app_${artifactTag}.apk"
            }
        }
    }

    packagingOptions {
        exclude "lib/*/libtermux.so"
        exclude "lib/*/liblocal-socket.so"
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:1.1.5"

    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.biometric:biometric:1.2.0-alpha05"
    implementation "androidx.media:media:1.7.0"
    implementation "androidx.preference:preference:1.2.1"

    // The API plugin must compile against the same forked TermuxConstants as the
    // main app. Upstream termux-shared resolves com.termux/com.termux.api and is
    // therefore incompatible with the RAFCODEPHI package and signature-permission route.
    if (rafcodephiSharedMode == "maven-local") {
        implementation "com.termux:termux-shared:0.118.0"
    } else if (rafcodephiSharedMode == "jitpack") {
        implementation "com.github.rafaelmeloreisnovo.termux-app-rafacodephi:termux-shared:${rafcodephiSharedVersion}"
    } else {
        throw new GradleException("Unsupported RAFCODEPHI_TERMUX_SHARED_MODE='${rafcodephiSharedMode}'")
    }
    // Use if below libraries are published locally by termux-app with `./gradlew publishReleasePublicationToMavenLocal` and used with `mavenLocal()`.
    // If updates are done, republish there and sync project with gradle files here
    // https://github.com/termux/termux-app/wiki/Termux-Libraries
    //implementation "com.termux:termux-shared:0.118.0"

    implementation "com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava"
    testImplementation "junit:junit:4.13.2"
}

task versionName {
    doLast {
        print android.defaultConfig.versionName
    }
}

@SuppressWarnings("UnnecessaryQualifiedReference")
static def validateVersionName(String versionName) {
    if (!java.util.regex.Pattern.matches("^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-((?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\\.(?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\\+([0-9a-zA-Z-]+(?:\\.[0-9a-zA-Z-]+)*))?\$", versionName))
        throw new GradleException("The versionName '" + versionName + "' is not a valid version as per semantic version '2.0.0' spec in the format 'major.minor.patch(-prerelease)(+buildmetadata)'. https://semver.org/spec/v2.0.0.html.")
}
