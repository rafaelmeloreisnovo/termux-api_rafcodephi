name: one-shot sensor bridge cleanup

on:
  push:
    branches:
      - codex/raf-sensor-native-pic-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: codex/raf-sensor-native-pic-cleanup
          fetch-depth: 0

      - name: Apply exact cleanup
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("native/vectra_pulse.S")
          text = path.read_text(encoding="utf-8")
          anchor = ".global attractor_table\n"
          insertion = anchor + ".hidden attractor_table  /* non-preemptible: permits direct PC-relative access in Android .so */\n"
          if ".hidden attractor_table" not in text:
              if text.count(anchor) != 1:
                  raise SystemExit("attractor_table anchor is not unique")
              text = text.replace(anchor, insertion, 1)
              path.write_text(text, encoding="utf-8")
          PY

          git show 1fb6177c5216c844fe696f76088e9c78dcca9b59:.github/workflows/github_action_build.yml \
            > .github/workflows/github_action_build.yml

          rm -f .github/workflows/one_shot_sensor_cleanup.yml

          git config user.name "rafaelmeloreisnovo"
          git config user.email "202743211+rafaelmeloreisnovo@users.noreply.github.com"
          git add native/vectra_pulse.S .github/workflows/github_action_build.yml \
            .github/workflows/one_shot_sensor_cleanup.yml
          git diff --cached --check
          git commit -m "fix(native): close PIC linker gap and remove diagnostic CI"
          git push origin HEAD:codex/raf-sensor-native-pic-cleanup
