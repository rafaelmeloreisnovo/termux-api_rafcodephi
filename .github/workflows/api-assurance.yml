name: Termux API Assurance

on:
  push:
    paths:
      - 'AGENTS.md'
      - 'contracts/api-assurance.v1.json'
      - 'scripts/validate_api_assurance.py'
      - '.github/workflows/api-assurance.yml'
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'contracts/api-assurance.v1.json'
      - 'scripts/validate_api_assurance.py'
      - '.github/workflows/api-assurance.yml'

permissions:
  contents: read

jobs:
  assurance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate API authority and evidence boundaries
        run: python3 scripts/validate_api_assurance.py
      - name: Negative gate — debug build cannot prove paired physical runtime
        run: |
          cp contracts/api-assurance.v1.json /tmp/api-assurance.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('contracts/api-assurance.v1.json')
          d = json.loads(p.read_text())
          d['pairing']['debug_build_is_pairing_proof'] = True
          d['physical_runtime']['state'] = 'PASS'
          d['claim_allowed'] = True
          p.write_text(json.dumps(d))
          PY
          if python3 scripts/validate_api_assurance.py; then
            echo 'FAIL: debug artifact was accepted as paired physical runtime' >&2
            exit 1
          fi
          mv /tmp/api-assurance.json contracts/api-assurance.v1.json
          python3 scripts/validate_api_assurance.py
